# Automate releases with Release Please.
# https://github.com/googleapis/release-please#release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Create releases for merged release PRs.
      - name: Create releases for merged release PRs
        uses: googleapis/release-please-action@v4
        id: release
        with:
          # Note: We use the default github token here because it doesn't
          # actually do any workflow-triggering actions. The triggering step is
          # the tag, below.
          target-branch: main
          skip-github-pull-request: true

      # Ensure that a tag is created, even if the release is created as a draft.
      # This works around https://github.com/googleapis/release-please-action/issues/962.
      # It also triggers the package action, which will publish the release when finished.
      - uses: actions/checkout@v4
        with:
          # Use a custom access token so downstream actions are triggered.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      - name: tag release
        if: ${{ steps.release.outputs.release_created }}
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git tag -d ${{ steps.release.outputs.tag_name }} || true
          git tag -a ${{ steps.release.outputs.tag_name }} -m "Release ${{ steps.release.outputs.tag_name }}"
          git push origin ${{ steps.release.outputs.tag_name }}

      # Add a comment with a durable link instead of the temporary unpublished one.
      - name: Find merged PR
        # release-please doesn't give us PR info even though the docs say it
        # will on release creation.
        if: steps.release.outputs.release_created
        uses: jwalton/gh-find-current-pr@master
        id: pr
        with:
          state: closed
      - name: Comment on merged PR
        if: steps.release.outputs.release_created && steps.pr.outputs.number
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ steps.pr.outputs.number }};
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `Packaging action triggered. Release will be available here when complete:

              ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.release.outputs.tag_name }}`
            });

      - name: Create release PRs for new commits on main
        id: release_pr
        uses: googleapis/release-please-action@v4
        with:
          # Use a custom access token so pull request actions are triggered.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: main
          skip-github-release: true

      # Detect an open release PR independently of release_pr.outputs.pr, which
      # is only set on runs where release-please actually creates or changes the
      # PR. We want to keep the snapshot current on every push while a release PR
      # is open, even when that run leaves the PR unchanged.
      - name: Find open release PR
        id: open_release_pr
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          set -euo pipefail
          branch="release-please--branches--main--components--glide-wm"
          number=$(gh pr list --state open --head "$branch" --json number --jq '.[0].number // empty')
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      # Add a serialized layout snapshot to the release PR so it is reviewed and
      # tested (via the PR's test run) before release, and so future versions can
      # be tested for restore compatibility (see tests/snapshots). current.ron is
      # kept current by the current_serialization_is_unchanged test; here we freeze
      # a copy under the upcoming version, but only when the format changed since
      # the last saved version. This re-applies on every run while the release PR
      # is open and is idempotent, so it ends up in the PR before merge.
      - name: Install latest stable
        if: steps.open_release_pr.outputs.number
        run: rustup update stable
      - name: Add layout restore snapshot to release PR
        if: steps.open_release_pr.outputs.number
        run: |
          set -euo pipefail
          branch="${{ steps.open_release_pr.outputs.branch }}"
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git fetch origin "$branch"
          git checkout -B "$branch" "origin/$branch"

          # The release branch already carries the version bump.
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')

          # The freeze decision and copy live in tested Rust
          # (crates/snapshot-support, which has no macOS dependencies so it
          # builds on this Linux runner). It prints the snapshot path it wrote,
          # or nothing when the serialized format is unchanged.
          target=$(cargo run --quiet --locked -p snapshot-support -- --version "$version")
          if [ -z "$target" ]; then
            echo "Serialized format unchanged; nothing to add for $version."
            exit 0
          fi
          git add "$target"
          if git diff --cached --quiet; then
            echo "Snapshot for $version already present on the release branch."
            exit 0
          fi
          git commit -m "chore: Save layout restore snapshot for $version"
          git push origin "$branch"
